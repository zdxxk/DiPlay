name: Device APK

on:
  push:
    branches: [codex/honor-7a-custom-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android 8+ debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-honor-7a-debug-source-build
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
